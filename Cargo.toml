[package]
name = "pianzo-tui"
version = "0.1.0"
edition = "2021"
description = "TUI-автонажиматель нот: проигрывает мелодии в активном окне, с закладками и глобальными хоткеями"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
enigo = "0.3"
rdev = { version = "0.5", features = ["serialize"] }
rodio = { version = "0.19", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
notify-rust = { version = "4", optional = true }

[features]
default = []

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[profile.release]
opt-level = 2
