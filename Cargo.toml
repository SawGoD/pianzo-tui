[package]
name = "pianzo-tui"
version = "0.3.0"
edition = "2021"
description = "TUI-автонажиматель нот: проигрывает мелодии в активном окне, с закладками и глобальными хоткеями"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
enigo = "0.3"
rdev = { version = "0.5", features = ["serialize"] }
rodio = { version = "0.19", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
notify-rust = { version = "4", optional = true }
sysinfo = "0.30"
self_update = { version = "0.39", default-features = false, features = [
    "archive-tar",
    "archive-zip",
    "compression-flate2",
    "compression-zip-deflate",
    "rustls",
] }

[features]
default = []

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
core-foundation = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "psapi"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
